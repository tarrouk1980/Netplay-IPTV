version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: optimark-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: optimark2025
      POSTGRES_DB: optimark
    ports:
      - "5432:5432"
    volumes:
      - optimark_data:/var/lib/postgresql/data

volumes:
  optimark_data:
